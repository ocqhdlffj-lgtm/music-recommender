<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 음악</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="오늘의 음악">
<meta name="theme-color" content="#f7f5f0">
<style id="app-style">
:root{
  --bg:#f7f5f0; --surface:#ffffff; --ink:#1d1b18; --muted:#6b665d; --line:#e4dfd4;
  --accent:#c2410c; --accent-soft:#fde8dc; --chip:#efebe2; --star:#d97706; --ok:#15803d; --bad:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161513; --surface:#211f1c; --ink:#f1ede6; --muted:#a39d92; --line:#36332e;
    --accent:#fb923c; --accent-soft:#3a2416; --chip:#2c2a26; --star:#fbbf24; --ok:#4ade80; --bad:#f87171; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161513; --surface:#211f1c; --ink:#f1ede6; --muted:#a39d92; --line:#36332e;
  --accent:#fb923c; --accent-soft:#3a2416; --chip:#2c2a26; --star:#fbbf24; --ok:#4ade80; --bad:#f87171; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden],.qhide{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted);font-size:14px}
.hbtns{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.errbox{margin:8px 16px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--bad);font-size:13px;font-weight:700}
button,a,input{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:20px}
.group{margin-bottom:14px}
.group:last-child{margin-bottom:0}
.label{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip:focus-visible,.btn:focus-visible,.tab:focus-visible,.fav:focus-visible,.theme:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border:1px solid transparent;background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=search]{flex:1;min-width:180px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:16px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;color:var(--muted);padding:8px 12px;font-size:15px;cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.count{color:var(--muted);font-size:13px;margin:12px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card.pick{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.top{display:flex;justify-content:space-between;gap:8px}
.title{font-weight:800;font-size:17px;letter-spacing:-.01em}
.artist{color:var(--muted);font-size:14px}
.fav{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);line-height:1;padding:0 2px}
.fav[aria-pressed="true"]{color:var(--star)}
.note{font-size:14px;margin:2px 0}
.note.src{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 7px}
.listen{font-size:13px;color:var(--accent);text-decoration:none;font-weight:700}
.more{display:flex;justify-content:center;margin-top:16px}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.then{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.then .row label{font-size:14px;font-weight:700}
.then input{width:120px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:15px}
.hint{margin:0;color:var(--muted);font-size:13px}
.simbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.simbar b{color:var(--accent)}
.actions{margin-top:auto;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.linkbtn{background:none;border:0;padding:0;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}
.linkbtn:hover{color:var(--accent)}
.linkbtn:focus-visible{color:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.editor{display:flex;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.editor .label{margin:0}
.editor .chip{font-size:13px;padding:4px 10px}
.editor .row{gap:8px}
.editor .btn{padding:6px 12px;font-size:13px}
.edmsg{margin:0;color:var(--accent);font-size:12px}
.tag.mine{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tools .btn{padding:6px 12px;font-size:13px}
.toast{color:var(--accent);font-size:13px;font-weight:700}
.copybox{width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px;font-size:13px}
.quiz{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.qtext{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.qsub{margin:0;color:var(--muted);font-size:14px}
.qopts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.qopt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px;cursor:pointer;min-width:0}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qopt.right{border-color:var(--ok);background:rgba(34,160,80,.14)}
.qopt.wrong{border-color:var(--bad);background:rgba(220,40,40,.12)}
.qopt:disabled{cursor:default}
.qfeed{margin:0;font-size:14px;font-weight:700}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qbig{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;margin:0}
.tag.age{background:var(--accent-soft);color:var(--accent);font-weight:700}
footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🎧 오늘의 음악</h1>
      <p class="sub">기분과 상황을 고르면 <span id="total"></span>곡 중에서 어울리는 노래를 골라 드려요.</p>
    </div>
    <div class="hbtns">
      <button class="theme" id="dlBtn" type="button">⬇ HTML 받기</button>
      <button class="theme" id="themeBtn" type="button">테마 전환</button>
      <span class="toast" id="dlMsg" role="status"></span>
    </div>
  </header>

  <section class="panel" id="filters" aria-label="필터">
    <div class="group"><div class="label">지금 기분</div><div class="chips" id="f-mood"></div></div>
    <div class="group"><div class="label">상황</div><div class="chips" id="f-scene"></div></div>
    <div class="group"><div class="label">장르</div><div class="chips" id="f-genre"></div></div>
    <div class="group"><div class="label">시대</div><div class="chips" id="f-era"></div></div>
    <div class="group"><div class="label">목록</div><div class="chips" id="f-src"></div></div>
    <div class="group row">
      <input type="search" id="q" placeholder="곡명·가수·앨범 검색 (예: 아이유, 비틀즈)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      <button class="btn" id="pickBtn" type="button">🎲 한 곡만 골라줘</button>
      <button class="btn ghost" id="resetBtn" type="button">초기화</button>
    </div>
  </section>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="all">추천 목록</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="then">🕰 그때 그 노래</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="quiz">🏆 1위곡 퀴즈</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="fav">★ 내 즐겨찾기</button>
  </div>
  <section class="quiz" id="quiz" hidden aria-live="polite"></section>
  <div class="then" id="thenPanel" hidden>
    <div class="row"><label for="birth">태어난 해</label><input type="number" id="birth" min="1930" max="2025" inputmode="numeric" placeholder="예: 1988"></div>
    <div class="chips" id="ages"></div>
    <p class="hint">태어난 해를 넣으면 그 나이 때 1위곡과 연말 차트 곡을 연도순으로 보여 드려요. 위의 기분·장르 필터도 함께 적용돼요.</p>
  </div>
  <div class="simbar" id="simbar" hidden><span id="simText"></span><button class="btn ghost" id="simClose" type="button">← 목록으로 돌아가기</button></div>
  <div class="tools" id="tools" hidden></div>
  <textarea class="copybox" id="copyBox" readonly hidden aria-label="복사할 내용"></textarea>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="more"><button class="btn ghost" id="moreBtn" type="button" hidden>더 보기</button></div>

  <footer>‘듣기’는 유튜브 검색 결과로 연결돼요. 즐겨찾기와 고친 태그는 이 브라우저에만 저장됩니다.</footer>
</div>

<script>
// 휴대폰에서 원인을 볼 수 있게: 스크립트 오류를 화면 맨 위에 표시
window.addEventListener("error", function(e){
  var d = document.getElementById("errbox");
  if(!d){ d = document.createElement("div"); d.id = "errbox"; d.className = "errbox"; document.body.insertBefore(d, document.body.firstChild); }
  d.textContent = "화면에 문제가 생겼어요. 이 문구를 캡처해서 알려 주세요: " + (e.message || "알 수 없는 오류") + (e.lineno ? " (" + e.lineno + "행)" : "");
});
</script>
<script>
// 받기용 원본: 렌더 전 화면 뼈대 + 이 스크립트. 뷰어가 끼워 넣은 것은 빼고 깨끗한 문서로 다시 조립
const SAVE_PARTS = { style: document.getElementById("app-style").outerHTML, body: document.querySelector(".wrap").outerHTML, script: (document.currentScript || document.scripts[document.scripts.length-1]).textContent };
// [제목, 가수, 연도, 장르, 기분[], 상황[], 한 줄 소개] — build.py가 data/songs.txt로 채움
const SONGS = /*__SONGS__*/[].map(([title,artist,year,genre,moods,scenes,note],i)=>({id:i,title,artist,year,genre,moods,scenes,note,era:eraOf(year),src:srcOf(note)}));

// 직접 고른 곡이 먼저, 차트 곡은 출처 문구로 구분
function srcOf(note){ return note.startsWith("차트 · 빌보드") ? "빌보드 연말 차트" : note.startsWith("차트 · ") ? "한국 차트 1위곡" : note.startsWith("명반 · ") ? "재즈 명반 수록곡" : "직접 고른 곡"; }
const SRC_ORDER = ["직접 고른 곡","한국 차트 1위곡","빌보드 연말 차트","재즈 명반 수록곡"];

function eraOf(y){ if(y<1970) return "~60년대"; if(y<2000) return `${String(y).slice(2,3)}0년대`; if(y<2010) return "2000년대"; if(y<2020) return "2010년대"; return "2020년대"; }

const uniq = (arr) => [...new Set(arr)];
const GENRE_ORDER = ["발라드","K-pop","인디/밴드","포크","록","팝","R&B/소울","댄스/일렉트로닉","힙합","컨트리","트로트","재즈","J-pop","클래식/뉴에이지"];
const ERA_ORDER = ["~60년대","70년대","80년대","90년대","2000년대","2010년대","2020년대"];
const FILTERS = {
  mood:  {key:"moods",  opts:["신남","잔잔","위로","설렘","그리움"]},
  scene: {key:"scenes", opts:["운동","드라이브","출근길","공부·작업","비 오는 날","잠들기 전"]},
  genre: {key:"genre",  opts:GENRE_ORDER.filter(g=>SONGS.some(s=>s.genre===g))},
  era:   {key:"era",    opts:ERA_ORDER.filter(e=>SONGS.some(s=>s.era===e))},
  src:   {key:"src",    opts:SRC_ORDER},
};
const PAGE = 60;
const state = {mood:new Set(),scene:new Set(),genre:new Set(),era:new Set(),src:new Set(),q:"",tab:"all",pick:null,limit:PAGE,similar:null,birth:null,age:1,editing:null,draft:null,edmsg:""};
// 그때 그 노래: [이름, 시작 나이, 끝 나이]
const AGES = [["10대 초반",13,15],["10대 후반",16,19],["20대 초반",20,24],["20대 후반",25,29],["30대",30,39]];
const rankOf = (s) => { const m = s.note.match(/(\d+)위$/); return m ? +m[1] : 0; };
const isKo = (s) => /[가-힣]/.test(s.title+s.artist) || ["K-pop","트로트","발라드"].includes(s.genre) || s.src==="한국 차트 1위곡";
const mainArtist = (s) => s.artist.toLowerCase().split(/\s+(?:featuring|feat\.?|ft\.?|with|and|&|x)\s+|,|\//)[0].trim();

// 비슷한 곡 점수: 같은 가수 > 장르·국내외 > 겹치는 기분·상황 > 가까운 연도
function simScore(a, b){
  let n = 0;
  if(mainArtist(a)===mainArtist(b)) n += 4;
  if(a.genre===b.genre) n += 2;
  if(isKo(a)===isKo(b)) n += 2;
  for(const m of b.moods) if(a.moods.includes(m)) n += 1;
  for(const c of b.scenes) if(a.scenes.includes(c)) n += 1;
  const d = Math.abs(a.year-b.year); if(d<=3) n += 2; else if(d<=8) n += 1;
  return n;
}

const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
};
const favKey = (s) => `${s.title}|${s.artist}`;
let favs = new Set(store.get("music.favs",[]));
// 고친 태그: { "제목|가수": {m:[기분], s:[상황]} } — 원래 태그는 orig에 보관
let edits = store.get("music.edits", {});
for(const s of SONGS){ s.orig = {moods:s.moods, scenes:s.scenes}; const e = edits[favKey(s)]; if(e){ s.moods=e.m; s.scenes=e.s; } }
const MOOD_OPTS = ["신남","잔잔","위로","설렘","그리움"];
const SCENE_OPTS = ["운동","드라이브","출근길","공부·작업","비 오는 날","잠들기 전"];

function buildChips(){
  for(const [name,f] of Object.entries(FILTERS)){
    const box = document.getElementById("f-"+name);
    box.innerHTML = "";
    for(const o of f.opts){
      const b = document.createElement("button");
      b.type="button"; b.className="chip"; b.textContent=o;
      b.setAttribute("aria-pressed", state[name].has(o));
      b.onclick = () => { state[name].has(o)?state[name].delete(o):state[name].add(o); state.pick=null; state.similar=null; state.editing=null; b.setAttribute("aria-pressed",state[name].has(o)); render(); };
      box.appendChild(b);
    }
  }
}

// 검색용: 소문자 + 공백·기호 제거, 해외 가수는 한글 이름도 붙여 둠

function normQ(v){ return String(v||"").toLowerCase().replace(/[\s.,'’"“”!?·\-–—()&/]+/g, ""); }
for(const s of SONGS){
  let ko = "";
  for(const k in ARTIST_KO) if(s.artist.toLowerCase().indexOf(k.toLowerCase())>=0) ko += ARTIST_KO[k] + ",";
  s.hay = normQ(s.title + s.artist + ko + s.note.replace(/^(차트|명반) · /, "") + s.genre);
}

function matches(s){
  for(const [name,f] of Object.entries(FILTERS)){
    const sel = state[name]; if(!sel.size) continue;
    const v = s[f.key];
    if(Array.isArray(v) ? !v.some(x=>sel.has(x)) : !sel.has(v)) return false;
  }
  const q = normQ(state.q);
  if(q && !s.hay.includes(q)) return false;
  return true;
}

// 고른 기분·상황과 겹치는 태그가 많을수록 위로
function score(s){
  let n=0; for(const m of s.moods) if(state.mood.has(m)) n++;
  for(const c of s.scenes) if(state.scene.has(c)) n++;
  return n;
}

function current(){
  if(state.similar!==null){
    const base = SONGS[state.similar];
    return SONGS.filter(s=>s!==base).map(s=>[s,simScore(base,s)]).filter(x=>x[1]>=5)
      .sort((x,y)=>y[1]-x[1] || SRC_ORDER.indexOf(x[0].src)-SRC_ORDER.indexOf(y[0].src) || x[0].id-y[0].id).slice(0,300).map(x=>x[0]);
  }
  let list = SONGS.filter(matches);
  if(state.tab==="fav") list = list.filter(s=>favs.has(favKey(s)));
  if(state.tab==="then"){
    if(!state.birth) return [];
    const [,lo,hi] = AGES[state.age];
    list = list.filter(s=>s.year>=state.birth+lo && s.year<=state.birth+hi);
    return list.sort((a,b)=>score(b)-score(a) || a.year-b.year || SRC_ORDER.indexOf(a.src)-SRC_ORDER.indexOf(b.src) || rankOf(a)-rankOf(b) || a.id-b.id);
  }
  return list.sort((a,b)=>score(b)-score(a) || SRC_ORDER.indexOf(a.src)-SRC_ORDER.indexOf(b.src) || a.id-b.id);
}

function esc(t){ return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function card(s){
  const fav = favs.has(favKey(s));
  const url = "https://www.youtube.com/results?search_query="+encodeURIComponent(s.artist+" "+s.title);
  const age = state.tab==="then" && state.similar===null && state.birth ? `<span class="tag age">${s.year-state.birth}살 때</span>` : "";
  const mine = edits[favKey(s)] ? `<span class="tag mine">✎ 고친 태그</span>` : "";
  const tags = age + mine + [s.genre, s.year+"년", ...s.moods, ...s.scenes].map(t=>`<span class="tag">${esc(t)}</span>`).join("");
  const body = state.editing===s.id ? editorHtml(s) : `<div class="tags">${tags}</div>`;
  return `<article class="card${state.pick===s.id?" pick":""}">
    <div class="top"><div><div class="title">${esc(s.title)}</div><div class="artist">${esc(s.artist)}</div></div>
    <button class="fav" type="button" data-id="${s.id}" aria-pressed="${fav}" aria-label="즐겨찾기">${fav?"★":"☆"}</button></div>
    <p class="note${/^(차트|명반) ·/.test(s.note)?" src":""}">${esc(s.note)}</p>
    ${body}
    <div class="actions"><a class="listen" href="${url}" target="_blank" rel="noopener">▶ 듣기</a><button class="linkbtn sim" type="button" data-id="${s.id}">비슷한 곡 →</button><button class="linkbtn edit" type="button" data-id="${s.id}">태그 고치기</button></div>
  </article>`;
}

function render(keepLimit){
  if(!keepLimit) state.limit = PAGE;
  let list = current();
  if(state.pick!==null){ const p=list.find(s=>s.id===state.pick); if(p) list=[p, ...list.filter(s=>s!==p)]; else state.pick=null; }
  const grid = document.getElementById("grid");
  const simOn = state.similar!==null;
  document.getElementById("simbar").hidden = !simOn;
  document.getElementById("thenPanel").hidden = simOn || state.tab!=="then";
  if(simOn){ const b=SONGS[state.similar]; document.getElementById("simText").innerHTML = `<b>${esc(b.title)}</b> · ${esc(b.artist)}와(과) 비슷한 곡 (같은 가수, 장르, 분위기, 시대 순)`; }
  if(state.tab==="then") renderThen();
  const qOn = state.tab==="quiz" && !simOn;
  document.getElementById("quiz").hidden = !qOn;
  document.getElementById("filters").hidden = qOn;
  for(const id of ["count","grid","moreBtn"]) document.getElementById(id).classList.toggle("qhide", qOn);
  if(qOn){ renderQuiz(); document.getElementById("tools").hidden = true; return; }
  renderTools();
  document.getElementById("count").textContent = state.pick!==null ? "🎲 이 곡 어때요? (아래는 나머지 추천)" : `${list.length.toLocaleString("ko-KR")}곡`;
  const more = document.getElementById("moreBtn");
  more.hidden = list.length <= state.limit;
  more.textContent = `더 보기 (${Math.min(PAGE, list.length-state.limit)}곡 / 남은 ${list.length-state.limit}곡)`;
  grid.innerHTML = list.length ? list.slice(0, state.limit).map(card).join("") :
    `<div class="empty">${emptyText()}</div>`;
}

function emptyText(){
  if(state.similar!==null) return "비슷한 곡을 찾지 못했어요.";
  if(state.tab==="fav") return "아직 즐겨찾기한 곡이 없어요. ☆를 눌러 저장해 보세요.";
  if(state.tab==="then" && !state.birth) return "태어난 해를 넣어 주세요. 예: 1988";
  if(state.tab==="then") return "이 나이대에는 조건에 맞는 곡이 없어요. 다른 나이대를 고르거나 필터를 풀어 보세요.";
  return "조건에 맞는 곡이 없어요. 필터를 조금 풀어 보세요.";
}

function renderThen(){
  const box = document.getElementById("ages");
  box.innerHTML = "";
  AGES.forEach(([name,lo,hi],i)=>{
    const b = document.createElement("button");
    b.type="button"; b.className="chip"; b.setAttribute("aria-pressed", state.age===i);
    b.textContent = state.birth ? `${name} (${state.birth+lo}~${state.birth+hi})` : name;
    b.onclick = () => { state.age=i; state.pick=null; store.set("music.age",i); render(); };
    box.appendChild(b);
  });
}

// ---- 1위곡 퀴즈 ----
// 문제 유형: (1) 이 노래가 처음 1위/차트에 오른 해는? (2) 다음 중 이 가수의 노래는?
const QN = 10;
const quiz = {pool:"전체", qs:[], i:0, right:0, picked:null};
const QPOOLS = {"전체":s=>s.src==="한국 차트 1위곡"||s.src==="빌보드 연말 차트", "한국 1위곡":s=>s.src==="한국 차트 1위곡", "빌보드":s=>s.src==="빌보드 연말 차트"};
const rnd = (n) => Math.floor(Math.random()*n);
const shuffle = (a) => { for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

function makeYearQ(s){
  const years = new Set([s.year]);
  while(years.size<4){ const y = s.year + (rnd(2)?1:-1)*(1+rnd(6)); if(y>=1959 && y<=2025) years.add(y); }
  const opts = shuffle([...years]).map(y=>({label:`${y}년`, ok:y===s.year}));
  const what = s.src==="빌보드 연말 차트" ? "빌보드 연말 Hot 100에 처음 오른 해는?" : "음악방송·디지털 차트에서 처음 1위를 한 해는?";
  return {song:s, text:`‘${s.title}’ (${s.artist})가 ${what}`, opts};
}
function makeArtistQ(s, pool){
  const me = mainArtist(s);
  const near = shuffle(pool.filter(x=>mainArtist(x)!==me && isKo(x)===isKo(s) && Math.abs(x.year-s.year)<=6 && x.title.toLowerCase()!==s.title.toLowerCase()));
  const picks = []; const seen = new Set([me]);
  for(const x of near){ const a = mainArtist(x); if(seen.has(a)) continue; seen.add(a); picks.push(x); if(picks.length===3) break; }
  if(picks.length<3) return null;
  const opts = shuffle([s, ...picks]).map(x=>({label:x.title, ok:x===s}));
  return {song:s, text:`다음 중 ${s.artist}의 노래는?`, opts};
}
function newQuiz(){
  const pool = SONGS.filter(QPOOLS[quiz.pool]);
  const qs = []; const used = new Set();
  let guard = 0;
  while(qs.length<QN && guard++<500){
    const s = pool[rnd(pool.length)]; if(used.has(s.id)) continue;
    const q = rnd(2) ? makeYearQ(s) : makeArtistQ(s, pool);
    if(!q) continue; used.add(s.id); qs.push(q);
  }
  Object.assign(quiz, {qs, i:0, right:0, picked:null});
}
function renderQuiz(){
  const box = document.getElementById("quiz");
  if(!quiz.qs.length) newQuiz();
  const best = store.get("music.quizBest", 0);
  const pools = Object.keys(QPOOLS).map(k=>`<button class="chip qpool" type="button" data-p="${k}" aria-pressed="${quiz.pool===k}">${k}</button>`).join("");
  if(quiz.i>=quiz.qs.length){
    const msg = quiz.right>=9 ? "차트 박사네요!" : quiz.right>=6 ? "꽤 잘 아시네요." : quiz.right>=3 ? "들어 본 노래가 많았죠?" : "새로 알게 된 노래를 들어 보세요.";
    box.innerHTML = `<div class="chips">${pools}</div><div class="qcard"><p class="qsub">결과</p><p class="qbig">${quiz.right} / ${quiz.qs.length}</p><p class="qtext">${msg}</p><p class="qsub">최고 기록 ${best} / ${QN}</p><div class="qrow"><button class="btn" id="qAgain" type="button">새 퀴즈 10문제</button></div></div>`;
    return;
  }
  const q = quiz.qs[quiz.i];
  const opts = q.opts.map((o,k)=>{
    let cls = "qopt";
    if(quiz.picked!==null){ if(o.ok) cls+=" right"; else if(k===quiz.picked) cls+=" wrong"; }
    return `<button class="${cls}" type="button" data-k="${k}" ${quiz.picked!==null?"disabled":""}>${esc(o.label)}</button>`;
  }).join("");
  let feed = "";
  if(quiz.picked!==null){
    const ok = q.opts[quiz.picked].ok, s = q.song;
    const url = "https://www.youtube.com/results?search_query="+encodeURIComponent(s.artist+" "+s.title);
    feed = `<p class="qfeed" style="color:${ok?"var(--ok)":"var(--bad)"}">${ok?"정답!":"아쉬워요."} ${esc(s.title)} · ${esc(s.artist)} · ${s.year}년</p>
      <p class="qsub">${esc(s.note.replace("차트 · ",""))}</p>
      <div class="qrow"><button class="btn" id="qNext" type="button">${quiz.i+1<quiz.qs.length?"다음 문제":"결과 보기"}</button><a class="listen" href="${url}" target="_blank" rel="noopener">▶ 듣기</a></div>`;
  }
  box.innerHTML = `<div class="chips">${pools}</div><div class="qcard">
    <div class="qmeta"><span>${quiz.i+1} / ${quiz.qs.length}번 문제</span><span>맞힌 문제 ${quiz.right} · 최고 기록 ${best}</span></div>
    <p class="qtext">${esc(q.text)}</p><div class="qopts">${opts}</div>${feed}</div>`;
}
document.getElementById("quiz").addEventListener("click", e=>{
  const pb = e.target.closest(".qpool");
  if(pb){ quiz.pool = pb.dataset.p; newQuiz(); renderQuiz(); return; }
  const o = e.target.closest(".qopt");
  if(o && quiz.picked===null){
    quiz.picked = +o.dataset.k;
    if(quiz.qs[quiz.i].opts[quiz.picked].ok) quiz.right++;
    renderQuiz(); return;
  }
  if(e.target.id==="qNext"){
    quiz.i++; quiz.picked=null;
    if(quiz.i>=quiz.qs.length && quiz.right>store.get("music.quizBest",0)) store.set("music.quizBest", quiz.right);
    renderQuiz(); return;
  }
  if(e.target.id==="qAgain"){ newQuiz(); renderQuiz(); }
});

  return `<div class="editor">
    <div class="label">기분</div><div class="chips">${MOOD_OPTS.map(v=>chip("m",v,state.draft.m.has(v))).join("")}</div>
    <div class="label">상황</div><div class="chips">${SCENE_OPTS.map(v=>chip("s",v,state.draft.s.has(v))).join("")}</div>

    <div class="row"><button class="btn ed-save" type="button">저장</button><button class="btn ghost ed-cancel" type="button">취소</button>${edits[favKey(s)]?'<button class="linkbtn ed-reset" type="button">원래 태그로</button>':""}</div>
  </div>`;
}

function renderTools(){
  const box = document.getElementById("tools");
  const n = Object.keys(edits).length;
  const parts = [];
  if(state.tab==="fav" && favs.size) parts.push(`<button class="btn ghost" id="copyFavs" type="button">즐겨찾기 ${favs.size}곡 목록 복사</button>`);
  if(n) parts.push(`<button class="btn ghost" id="copyEdits" type="button">고친 태그 ${n}곡 복사</button>`);
  parts.push(`<span class="toast" id="toast"></span>`);
  box.innerHTML = parts.join("");
  box.hidden = parts.length===1 || state.similar!==null;
}

// 복사: 클립보드가 막히면 글상자에 띄워 직접 복사하게 함
function copyText(text, done){
  const box = document.getElementById("copyBox");
  const show = () => { box.hidden=false; box.value=text; box.focus(); box.select(); document.getElementById("toast").textContent="아래 글상자에서 직접 복사해 주세요."; };
  box.hidden = true;
  try{
    navigator.clipboard.writeText(text).then(()=>{ document.getElementById("toast").textContent=done; }, show);
  }catch(e){ show(); }
}

document.getElementById("tools").addEventListener("click", e=>{
  if(e.target.id==="copyFavs"){
    const lines = SONGS.filter(s=>favs.has(favKey(s))).map(s=>`${s.title} - ${s.artist} (${s.year})`);
    copyText("내 즐겨찾기 ("+lines.length+"곡)\n"+lines.join("\n"), "즐겨찾기 목록을 복사했어요.");
  }
  if(e.target.id==="copyEdits"){
    const lines = Object.entries(edits).map(([k,v])=>`${k}|${v.m.join(",")}|${v.s.join(",")}`);
    copyText("# 고친 태그 (제목|가수|기분|상황)\n"+lines.join("\n"), "고친 태그를 복사했어요. 이 내용을 보내 주시면 데이터에 반영할 수 있어요.");
  }
});

document.getElementById("grid").addEventListener("click",e=>{
  const ed = e.target.closest(".edit");
  if(ed){ const s=SONGS[+ed.dataset.id]; state.editing=s.id; state.edmsg=""; state.draft={m:new Set(s.moods), s:new Set(s.scenes)}; render(true); return; }
  const ec = e.target.closest(".ed-chip");
  if(ec){ const set = state.draft[ec.dataset.kind]; set.has(ec.dataset.v)?set.delete(ec.dataset.v):set.add(ec.dataset.v); state.edmsg=""; render(true); return; }
  if(e.target.closest(".ed-cancel")){ state.editing=null; render(true); return; }
  if(e.target.closest(".ed-save")){
    const s = SONGS[state.editing];
    if(!state.draft.m.size || !state.draft.s.size){ state.edmsg="기분과 상황을 하나 이상씩 골라 주세요."; render(true); return; }
    const m = MOOD_OPTS.filter(v=>state.draft.m.has(v)), sc = SCENE_OPTS.filter(v=>state.draft.s.has(v));
    const same = m.join()===s.orig.moods.join() && sc.join()===s.orig.scenes.join();
    if(same) delete edits[favKey(s)]; else edits[favKey(s)] = {m, s:sc};
    s.moods=m; s.scenes=sc; store.set("music.edits", edits); state.editing=null; render(true); return;
  }
  if(e.target.closest(".ed-reset")){
    const s = SONGS[state.editing]; delete edits[favKey(s)]; s.moods=s.orig.moods; s.scenes=s.orig.scenes;
    store.set("music.edits", edits); state.editing=null; render(true); return;
  }
  const sim = e.target.closest(".sim");
  if(sim){ state.similar=+sim.dataset.id; state.pick=null; render(); window.scrollTo({top:document.querySelector(".tabs").offsetTop-8,behavior:"smooth"}); return; }
  const b = e.target.closest(".fav"); if(!b) return;
  const k = favKey(SONGS[+b.dataset.id]);
  favs.has(k)?favs.delete(k):favs.add(k);
  store.set("music.favs",[...favs]); render(true);
});
document.getElementById("moreBtn").onclick = () => { state.limit += PAGE; render(true); };
const qIn = document.getElementById("q");
function onSearch(){ if(qIn.value===state.q) return; state.q=qIn.value; state.pick=null; state.similar=null; state.editing=null; render(); }
["input","keyup","change","search","compositionend"].forEach(ev=>qIn.addEventListener(ev, onSearch));
setInterval(onSearch, 300);
document.getElementById("pickBtn").onclick = () => {
  const list = current(); if(!list.length){ state.pick=null; render(); return; }
  const top = score(list[0]); const pool = list.filter(s=>score(s)===top);
  state.pick = pool[Math.floor(Math.random()*pool.length)].id; render(); window.scrollTo({top:document.querySelector(".tabs").offsetTop-8,behavior:"smooth"});
};
document.getElementById("resetBtn").onclick = () => { for(const k of Object.keys(FILTERS)) state[k].clear(); state.q=""; state.pick=null; state.similar=null; qIn.value=""; buildChips(); render(); };
document.getElementById("simClose").onclick = () => { state.similar=null; render(); };
const birthIn = document.getElementById("birth");
birthIn.addEventListener("input", () => {
  const y = parseInt(birthIn.value, 10);
  state.birth = y>=1930 && y<=2025 ? y : null; state.pick=null;
  store.set("music.birth", state.birth); render();
});
state.birth = store.get("music.birth", null); state.age = store.get("music.age", 1);
if(state.birth) birthIn.value = state.birth;
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  state.tab=t.dataset.tab; state.pick=null; state.similar=null; state.editing=null; document.getElementById("copyBox").hidden=true;
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t)); render();
});
const root = document.documentElement;
const savedTheme = store.get("music.theme",null); if(savedTheme) root.dataset.theme=savedTheme;
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark?"light":"dark"; store.set("music.theme",root.dataset.theme);
};

const dlCap = window.claude && window.claude.use ? window.claude.use("downloads").catch(()=>null) : Promise.resolve(null);
function standaloneHtml(){
  return `<!doctype html>\n<html lang="ko">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>오늘의 음악</title>\n${SAVE_PARTS.style}\n</head>\n<body>\n${SAVE_PARTS.body}\n<script>${SAVE_PARTS.script}<\/script>\n</body>\n</html>\n`;
}
document.getElementById("dlBtn").onclick = async () => {
  const msg = document.getElementById("dlMsg");
  const html = standaloneHtml(), name = "music-recommender.html";
  if(!window.claude){
    // 일반 브라우저로 연 파일: 그냥 내려받기
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([html], {type:"text/html"})); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    msg.textContent = "내려받기를 시작했어요."; return;
  }
  const dl = await dlCap;
  if(!dl){ msg.textContent = "이 화면에서는 파일을 받을 수 없어요."; return; }
  try{ await dl.save({filename:name, data:new Blob([html])}); msg.textContent = "저장했어요."; }
  catch(e){ msg.textContent = e && e.code==="declined" ? "" : e && e.code==="rate_limited" ? "잠시 뒤 다시 눌러 주세요." : "이 화면에서는 파일을 받을 수 없어요."; }
};

document.getElementById("total").textContent = SONGS.length.toLocaleString("ko-KR");
buildChips(); render();
</script>
